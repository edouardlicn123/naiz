# FM timbre acceptance bands for the demo-a2 default patch families
# (devdocs/136 P1b).  One table per family; family order/set mirrors
# tools/naiz_audio/gm_families.py FAMILIES.
#
# Bands are DESIGN INTENT: initial values from FM/orchestral knowledge, to be
# corrected by the P1c oracle<->NP2kai alignment pass plus the P2/P3 timbre
# work.  `calibrated` gates enforcement in tools/tests/test_fm_timbre.py:
#
#   calibrated = false  -> the oracle only checks sanity (patch sounds, has a
#                          measurable fundamental).  The band is documented
#                          intent, not yet met/verified.
#   calibrated = true   -> the oracle must place every listed metric inside its
#                          band, else the test fails.
#
# Flip a family to true once P1c/P2 has verified its .fmp actually meets the
# band.  All metrics are measured by tools/naiz_audio/spectrum_report.py from a
# C4 (note 60) probe rendered by the fmbench oracle; see devdocs/136 P1b for
# the metric definitions.

[piano]
calibrated = false
attack_ms   = [1, 25]
centroid_hz = [900, 3500]
harmonics   = { "2f" = [-18, -4], "3f" = [-30, -6] }

[bell]
calibrated = false
attack_ms   = [1, 20]
centroid_hz = [1500, 5000]
# Bells are inharmonic; only a weak 2f band is meaningful.
harmonics   = { "2f" = [-18, 10] }

[organ]
calibrated = false
attack_ms   = [5, 80]
centroid_hz = [300, 900]
harmonics   = { "2f" = [-22, -6], "3f" = [-65, -40] }

