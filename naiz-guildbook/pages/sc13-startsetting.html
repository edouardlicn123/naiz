<h1>startsetting 启动设置</h1>
<hr>
<blockquote><strong>创建</strong>：2026-08-29</blockquote>
<p><code>startsetting</code> 命令打开设置菜单，保存设置，并在语言变更时重载字体与剧本语言。该命令无参数。</p>

<h2>1. 语法</h2>
<pre><code>startsetting</code></pre>
<table>
<tr><th>参数</th><th>类型</th><th>说明</th></tr>
<tr><td>—</td><td>—</td><td>无参数</td></tr>
</table>

<h2>2. 示例</h2>
<pre><code>mainmenu start
startsetting</code></pre>

<div class="note-box"><p>内部调用设置菜单运行函数；若语言发生改变，会重新加载 CJK 字体与 NB 文本（见 <code>nb_mainmenu.c</code> 的 <code>cmd_startsetting</code>）。</p></div>
