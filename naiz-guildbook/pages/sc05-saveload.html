<h1>loadscene 读档</h1>
<hr>
<blockquote><strong>创建</strong>：2026-07-27<br><strong>最后更新</strong>：2026-09-11</blockquote>
<p><code>loadscene()</code> 命令用于弹出读档选单。</p>

<h2>1. 语法</h2>
<pre><code>loadscene()</code></pre>
<table>
<tr><th>参数</th><th>类型</th><th>说明</th></tr>
<tr><td>—</td><td>—</td><td>无参数；调用时弹出读档网格选单（每页 9 格）</td></tr>
</table>

<h2>2. 行为</h2>
<ul>
<li><strong>读档选单</strong>：按方向键/鼠标选择槽位，<kbd>Enter</kbd> 确认读档，按 <kbd>Del</kbd> 键可删除存档</li>
<li><strong>存档入口</strong>：存档不通过脚本命令触发——由主菜单「Save」项或游戏内快捷键弹出（详见 <code>sc07-mainmenu.html</code>）</li>
</ul>

</main>
