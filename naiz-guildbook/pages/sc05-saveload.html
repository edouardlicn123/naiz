<h1>savescene / loadscene 存档与读档</h1>
<hr>
<blockquote><strong>创建</strong>：2026-07-27</blockquote>
<p><code>savescene()</code> 和 <code>loadscene()</code> 命令用于弹出存档/读档选单。</p>

<h2>1. 语法</h2>
<pre><code>savescene()
loadscene()</code></pre>
<p>均无参数，调用时弹出网格选单（每页 9 格）。</p>

<h2>2. 行为</h2>
<ul>
<li><strong>存档选单</strong>：可修改 <code>dlgstyle</code> / <code>btnstyle</code> / <code>lang</code> 设置</li>
<li><strong>读档选单</strong>：按 <kbd>Del</kbd> 键可删除存档</li>
</ul>
